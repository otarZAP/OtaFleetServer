[env:esp32dev]
platform       = espressif32
board          = esp32dev
framework      = arduino
monitor_speed  = 115200
upload_speed   = 921600

; SPIFFS partition — 1.5 MB filesystem leaves ~1.3 MB for firmware
board_build.partitions = min_spiffs.csv

; Enable regex path matching in ESPAsyncWebServer
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DASYNCWEBSERVER_REGEX=1

lib_deps =
  mathieucarbou/ESP Async WebServer@^3.3.23
  mathieucarbou/AsyncTCP@^3.3.8
  bblanchon/ArduinoJson@^7.1.0
